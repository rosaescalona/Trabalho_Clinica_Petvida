<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="PetVida — agenda unificada de saúde e estética para a recepção da clínica.">
  <title>PetVida · Agenda da recepção</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Navegação principal">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><circle cx="9" cy="11" r="3.2"/><circle cx="16" cy="8" r="3.2"/><circle cx="23" cy="11" r="3.2"/><path d="M16 14c-5 0-9 5-9 9 0 3 3 4 5 3s2.5-1.5 4-1.5 2 .5 4 1.5 5 0 5-3c0-4-4-9-9-9z"/></svg>
        </span>
        <span class="brand-name">PetVida</span>
      </div>
      <nav class="nav">
        <button class="nav-btn is-active" data-view="agenda">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          <span>Agenda</span>
        </button>
        <button class="nav-btn" data-view="pets">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
          <span>Pets</span>
        </button>
        <button class="nav-btn" data-view="lembretes">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
          <span>Lembretes</span>
          <span class="badge" id="badge-lembretes" hidden></span>
        </button>
        <button class="nav-btn" data-view="painel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          <span>Painel</span>
        </button>
      </nav>
      <button class="reset-btn" id="btn-reset" title="Restaura os dados de demonstração">Restaurar demonstração</button>
    </aside>

    <main class="main" id="main">
      <section class="view" id="view-agenda" aria-labelledby="t-agenda"></section>
      <section class="view" id="view-pets" aria-labelledby="t-pets" hidden></section>
      <section class="view" id="view-lembretes" aria-labelledby="t-lembretes" hidden></section>
      <section class="view" id="view-painel" aria-labelledby="t-painel" hidden></section>
    </main>
  </div>

  <!-- Modal: novo agendamento -->
  <dialog id="dlg-agendar" class="dialog">
    <form id="form-agendar" novalidate>
      <header class="dialog-head">
        <h2>Novo agendamento</h2>
        <button type="button" class="icon-btn" data-close aria-label="Fechar">✕</button>
      </header>
      <div class="dialog-body">
        <label class="field">Pet
          <select name="petId" required></select>
        </label>
        <label class="field">Serviço
          <select name="servicoId" required></select>
        </label>
        <label class="field">Profissional
          <select name="staffId" required></select>
        </label>
        <div class="field-row">
          <label class="field">Data
            <input type="date" name="data" required>
          </label>
          <label class="field">Início
            <select name="inicio" required></select>
          </label>
        </div>
        <label class="field">Observação para a equipe
          <input type="text" name="obs" maxlength="140" placeholder="Opcional">
        </label>
        <div class="notice" id="aviso-saude" hidden></div>
        <p class="form-error" id="erro-agendar" role="alert" hidden></p>
      </div>
      <footer class="dialog-foot">
        <button type="button" class="btn ghost" data-close>Cancelar</button>
        <button type="submit" class="btn primary">Agendar</button>
      </footer>
    </form>
  </dialog>

  <!-- Modal: detalhe do agendamento -->
  <dialog id="dlg-detalhe" class="dialog">
    <div id="detalhe-conteudo"></div>
  </dialog>

  <!-- Modal: concluir atendimento -->
  <dialog id="dlg-concluir" class="dialog">
    <form id="form-concluir">
      <header class="dialog-head">
        <h2>Concluir atendimento</h2>
        <button type="button" class="icon-btn" data-close aria-label="Fechar">✕</button>
      </header>
      <div class="dialog-body">
        <label class="field">O que foi feito / observado
          <textarea name="nota" rows="3" maxlength="300" placeholder="Ex.: pelagem sem nós, unhas cortadas"></textarea>
        </label>
        <label class="check" id="wrap-alerta">
          <input type="checkbox" name="alertarVet">
          <span>Pedir avaliação do veterinário (ex.: pele irritada, caroço, ferida)</span>
        </label>
      </div>
      <footer class="dialog-foot">
        <button type="button" class="btn ghost" data-close>Voltar</button>
        <button type="submit" class="btn primary">Salvar no histórico</button>
      </footer>
    </form>
  </dialog>

  <!-- Modal: novo pet -->
  <dialog id="dlg-pet" class="dialog">
    <form id="form-pet" novalidate>
      <header class="dialog-head">
        <h2>Cadastrar pet</h2>
        <button type="button" class="icon-btn" data-close aria-label="Fechar">✕</button>
      </header>
      <div class="dialog-body">
        <div class="field-row">
          <label class="field">Nome do pet <input name="nome" required maxlength="40"></label>
          <label class="field">Espécie
            <select name="especie"><option>Cão</option><option>Gato</option><option>Outro</option></select>
          </label>
        </div>
        <div class="field-row">
          <label class="field">Raça <input name="raca" maxlength="40"></label>
          <label class="field">Porte
            <select name="porte"><option>Pequeno</option><option>Médio</option><option>Grande</option></select>
          </label>
        </div>
        <label class="field">Tutor <input name="tutor" required maxlength="60"></label>
        <div class="field-row">
          <label class="field">WhatsApp (DDD + número) <input name="telefone" required inputmode="numeric" placeholder="41999998888"></label>
          <label class="field">Banho a cada (dias) <input name="ciclo" type="number" min="0" max="90" value="15"></label>
        </div>
        <p class="form-error" id="erro-pet" role="alert" hidden></p>
      </div>
      <footer class="dialog-foot">
        <button type="button" class="btn ghost" data-close>Cancelar</button>
        <button type="submit" class="btn primary">Cadastrar pet</button>
      </footer>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
